<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>X 互关线索台</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">X / CONNECTION REVIEW</p>
        <h1>互关线索台</h1>
      </div>
      <span class="local-tag">仅本地保存</span>
    </header>

    <section class="panel import-panel">
      <div class="section-head">
        <div><p class="kicker">01 / 导入</p><h2>帖子链接与原文</h2></div>
        <span id="importCount" class="count-badge">0 个账号</span>
      </div>
      <textarea id="postInput" placeholder="每行一条：求互关，关注必回 https://x.com/example/status/123&#10;也可只粘贴帖子链接，稍后人工核对" spellcheck="false"></textarea>
      <div class="row import-actions">
        <p>仅导入帖子链接；同一账号只保留一条。文字需与链接在同一行。</p>
        <button id="importButton" class="primary-button" type="button">导入候选</button>
      </div>
    </section>

    <section class="panel template-panel">
      <div class="section-head">
        <div><p class="kicker">02 / 回复模板</p><h2>默认回复内容</h2></div>
        <span id="templateCount" class="count-badge">0 字</span>
      </div>
      <textarea id="replyTemplate" placeholder="写下你常用的回复。每条候选都可单独修改。" spellcheck="false"></textarea>
      <div class="row template-actions">
        <p>模板自动保存在本地；修改模板不会覆盖已单独编辑的回复。</p>
        <button id="applyTemplateButton" class="secondary-button" type="button">应用到待处理</button>
      </div>
    </section>

    <section class="panel results-panel">
      <div class="section-head results-head">
        <div><p class="kicker">03 / 逐条处理</p><h2>候选帖子</h2></div>
        <span id="summary" class="summary">0 待处理</span>
      </div>
      <div class="filter-row">
        <button class="filter active" data-filter="pending" type="button">待处理</button>
        <button class="filter" data-filter="all" type="button">全部</button>
        <button class="filter" data-filter="replied" type="button">已回复</button>
        <button class="filter" data-filter="skipped" type="button">已跳过</button>
      </div>
      <div id="candidateList" class="candidate-list">
        <div class="empty-state">导入帖子后，在这里逐条查看和处理。</div>
      </div>
    </section>
    <p id="notice" class="notice" role="status">关注和回复需在 X 页面由你逐条完成；此处记录处理状态。</p>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
